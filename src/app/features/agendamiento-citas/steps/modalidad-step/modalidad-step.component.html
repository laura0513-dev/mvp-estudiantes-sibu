<form [formGroup]="formGroup" class="modalidad-form" novalidate>
  <fieldset class="modalidad-fieldset" [attr.aria-describedby]="muestraError ? 'modalidad-error' : null">
    <legend class="modalidad-legend">Selecciona la modalidad de tu cita</legend>

    <mat-radio-group
      formControlName="tipo"
      class="modalidad-group"
      aria-label="Modalidad de la cita"
    >
      @for (opcion of opciones; track opcion.valor) {
        <div class="modalidad-opcion">
          <mat-radio-button
            [value]="opcion.valor"
            [attr.aria-describedby]="descripcionId(opcion.valor)"
          >
            <span class="opcion-titulo">
              <mat-icon aria-hidden="true">{{ opcion.icono }}</mat-icon>
              {{ opcion.titulo }}
            </span>
          </mat-radio-button>
          <p class="opcion-descripcion" [id]="descripcionId(opcion.valor)">
            {{ opcion.descripcion }}
          </p>
        </div>
      }
    </mat-radio-group>

    @if (muestraError) {
      <p class="error-mensaje" id="modalidad-error" role="alert">
        <mat-icon aria-hidden="true">error</mat-icon>
        Debes seleccionar una modalidad para continuar.
      </p>
    }
  </fieldset>
</form>
